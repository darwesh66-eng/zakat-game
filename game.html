<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الزكاة — العالم</title>
<style>
@font-face{font-family:'Lalezar';src:url(assets__fonts__lalezar.woff2) format('woff2')}
@font-face{font-family:'Changa';font-weight:500;src:url(assets__fonts__changa-m.woff2) format('woff2')}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 100%,#3a1d10,#120906 70%);color:#fff7ee;font-family:'Changa',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
h1{font-family:'Lalezar',serif;font-weight:400;font-size:52px;margin:0 0 6px}
p{opacity:.8;margin:6px 0;font-size:18px}
b{color:var(--accent,#ffd166)}
a{display:inline-block;margin-top:22px;color:#1a0f0a;background:linear-gradient(180deg,#ffe2a8,#ffb457);padding:12px 26px;border-radius:14px;text-decoration:none;font-size:18px}
</style>
</head>
<body>
<div>
  <h1>رحلة الزكاة</h1>
  <p>أهلًا يا <b id="n">…</b> — روبوتك <b id="r">…</b> جاهز.</p>
  <p>العالمُ يُبنى الآن… هذه شاشةُ الدخول فقط.</p>
  <a href="index.html">العودة إلى شاشة الدخول</a>
</div>
<script>
try{ const p=JSON.parse(localStorage.getItem('zakat.player')||'{}'); document.getElementById('n').textContent=p.name||'بطل'; const names={noor:'نور',shihab:'شهاب',haris:'حارس',zumurrud:'زمرّد'}; document.getElementById('r').textContent=names[p.robot]||''; if(p.accent) document.documentElement.style.setProperty('--accent','#'+p.accent.toString(16).padStart(6,'0')); }catch(e){}
</script>
</body>
</html>
