<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0f0a">
<title>رحلة الزكاة — الدخول</title>
<style>
@font-face{font-family:'Lalezar';src:url(assets__fonts__lalezar.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Changa';font-weight:500;src:url(assets__fonts__changa-m.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Changa';font-weight:700;src:url(assets__fonts__changa-b.woff2) format('woff2');font-display:swap}
:root{--accent:#35d6ff;--ink:#fff7ee;--glass:rgba(24,14,10,.46);--line:rgba(255,235,210,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0f0a;color:var(--ink);font-family:'Changa',system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* ===== اللوحة ===== */
#panel{position:fixed;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));width:min(400px,calc(100% - 36px));max-height:calc(100% - 36px);padding:26px 26px 22px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);overflow:auto}
#panel.in{opacity:1;transform:none}
#panel.leaving{opacity:0;transform:translateY(-14px) scale(.98);transition-duration:.6s}
h1{font-family:'Lalezar',serif;font-weight:400;font-size:44px;line-height:1;margin:0;letter-spacing:0;color:#fff3e2;text-shadow:0 2px 24px rgba(255,170,80,.35)}
.sub{margin:6px 0 18px;font-size:14px;opacity:.78}
.lbl{font-size:13px;opacity:.7;margin:14px 0 8px}
#chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:14px;padding:10px 4px 8px;font:inherit;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.25s}
.chip i{display:block;width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px currentColor}
.chip.on{background:rgba(255,255,255,.14);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px rgba(0,0,0,.25)}
.who{display:flex;align-items:baseline;gap:10px;margin-top:12px}
#rname{font-family:'Lalezar',serif;font-size:30px;line-height:1;color:var(--accent);text-shadow:0 0 18px var(--accent)}
#rdesc{font-size:14px;opacity:.8}
#preview{display:flex;gap:8px;flex-wrap:wrap}
.pv{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.pv:active{background:rgba(255,255,255,.18)}
#name{width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-size:19px;outline:none;transition:.2s}
#name:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
#name::placeholder{color:rgba(255,240,220,.55)}
#go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:20px;color:#1a0f0a;background:linear-gradient(180deg,#ffe2a8,#ffb457);box-shadow:0 10px 30px rgba(255,160,60,.35);cursor:pointer;transition:.2s}
#go:active{transform:translateY(1px)}
#err{min-height:20px;margin-top:8px;font-size:13px;color:#ffb0a0}
.foot{margin-top:10px;font-size:11.5px;opacity:.55;text-align:center}
/* ===== التحميل ===== */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 80% at 50% 100%,#3a1d10,#120906 70%);z-index:5;transition:opacity .9s}
#loader.hide{opacity:0;pointer-events:none}
#loader h1{font-size:60px}
#track{width:min(320px,70%);height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ffb457,#ffe2a8);transition:width .3s}
#ltext{font-size:14px;opacity:.7}
/* ===== الجوال/الآيباد عموديًّا ===== */
@media (max-aspect-ratio:9/10){
  #panel{top:auto;right:max(12px,env(safe-area-inset-right));left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:auto;max-height:62%;padding:18px 18px 14px;border-radius:20px}
  h1{font-size:34px}.sub{margin-bottom:8px}#chips{gap:6px}.chip{padding:8px 2px 6px;font-size:14px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loader"><h1>رحلة الزكاة</h1><div id="track"><div id="bar"></div></div><div id="ltext">يُجهَّزُ العالم…</div></div>
<aside id="panel">
  <h1>رحلة الزكاة</h1>
  <div class="sub">التربية الإسلاميّة — الصفّ التاسع · مدرسة دسمان ثنائيّة اللغة</div>
  <div class="lbl">اخترْ روبوتك</div>
  <div id="chips"></div>
  <div class="who"><div id="rname">نور</div><div id="rdesc"></div></div>
  <div class="lbl">جرّبْ حركة</div>
  <div id="preview"></div>
  <div class="lbl">اسمُك</div>
  <input id="name" type="text" maxlength="24" autocomplete="off" placeholder="اكتب اسمك هنا">
  <button id="go" type="button">ادخل الرحلة</button>
  <div id="err"></div>
  <div class="foot">سيحفظُ المعلّمُ اسمك ونقاطك عند إتمام الرحلة</div>
</aside>
<script>window.__FLAT=1;</script>
<script src="login.bundle.js"></script>
</body>
</html>
